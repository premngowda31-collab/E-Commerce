<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mysuru Fashion | Products</title>

<link rel="stylesheet"
href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

<style>

/* SAME UI */

.bg-slideshow{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-3;
}

.bg-slideshow img{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
opacity:0;
animation:slideShow 36s infinite;
}

.bg-slideshow img:nth-child(1){animation-delay:0s}
.bg-slideshow img:nth-child(2){animation-delay:6s}
.bg-slideshow img:nth-child(3){animation-delay:12s}
.bg-slideshow img:nth-child(4){animation-delay:18s}
.bg-slideshow img:nth-child(5){animation-delay:24s}
.bg-slideshow img:nth-child(6){animation-delay:30s}

@keyframes slideShow{
0%{opacity:0;transform:scale(1.15)}
5%{opacity:1}
20%{opacity:1;transform:scale(1)}
25%{opacity:0}
100%{opacity:0}
}

.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
z-index:-2;
}

body{
font-family:'Segoe UI',sans-serif;
color:white;
}

.navbar{
background:rgba(255,255,255,0.08);
backdrop-filter:blur(12px);
padding:15px 30px;
}

.product-card{
background:rgba(255,255,255,0.14);
backdrop-filter:blur(16px);
border-radius:18px;
padding:20px;
transition:0.4s;
border:1px solid rgba(255,255,255,0.2);
text-align:center;
height:100%;
}

.product-card:hover{
transform:translateY(-10px);
box-shadow:0 20px 50px rgba(0,0,0,0.7);
}

.category{
font-size:11px;
background:#ffc107;
color:black;
padding:4px 10px;
border-radius:20px;
}

.price{
font-weight:bold;
color:#ffc107;
font-size:18px;
}

.button-group{
display:flex;
justify-content:center;
gap:10px;
margin-top:10px;
}

.cart-btn{
background:linear-gradient(45deg,#ff416c,#ff4b2b);
border:none;
border-radius:25px;
padding:8px 16px;
color:white;
}

</style>

</head>

<body>

<!-- BACKGROUND -->
<div class="bg-slideshow">
<img src="https://images.unsplash.com/photo-1483985988355-763728e1935b">
<img src="https://images.unsplash.com/photo-1445205170230-053b83016050">
<img src="https://images.unsplash.com/photo-1520975661595-6453be3f7070">
<img src="https://images.unsplash.com/photo-1520975922284-9d8c7a2e3f4c">
<img src="https://images.pexels.com/photos/3794184/pexels-photo-3794184.jpeg">
<img src="https://images.unsplash.com/photo-1520974735194-6b9b0f7d7a6c">
</div>

<div class="overlay"></div>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg">
<a class="navbar-brand text-white">Mysuru Fashion</a>

<div class="ml-auto" style="width:300px;">
<input type="text"
class="form-control"
placeholder="Search products..."
onclick="goToSearchPage()"
readonly>
</div>

</nav>

<div class="container py-5">
<div class="row" id="productGrid"></div>
</div>

<!-- 🔥 ONLY PRODUCTS ARRAY UPDATED (100 PRODUCTS) -->

<script>

/* 🔍 REDIRECT SEARCH */
function goToSearchPage(){
window.location.href = "search.html";
}

/* CATEGORY FILTER */
const params = new URLSearchParams(window.location.search);
const selectedCategory = params.get("category");

/* 🔥 100 PRODUCTS */
let products = [

/* MEN */
{name:"Blue Denim Shirt",price:400,cat:"Shirt",type:"men",img:"https://source.unsplash.com/300x400/?shirt"},
{name:"Red Hoodie",price:550,cat:"Hoodie",type:"men",img:"https://source.unsplash.com/300x400/?hoodie"},
{name:"Black Jacket",price:700,cat:"Jacket",type:"men",img:"https://source.unsplash.com/300x400/?jacket"},
{name:"White Shirt",price:350,cat:"Shirt",type:"men",img:"https://source.unsplash.com/300x400/?white-shirt"},
{name:"Grey Sweatshirt",price:500,cat:"Sweatshirt",type:"men",img:"https://source.unsplash.com/300x400/?sweatshirt"},
{name:"Casual Shirt",price:420,cat:"Shirt",type:"men",img:"https://source.unsplash.com/300x400/?casual-shirt"},
{name:"Winter Hoodie",price:620,cat:"Hoodie",type:"men",img:"https://source.unsplash.com/300x400/?winter-hoodie"},
{name:"Leather Jacket",price:1200,cat:"Jacket",type:"men",img:"https://source.unsplash.com/300x400/?leather-jacket"},
{name:"Street Hoodie",price:590,cat:"Hoodie",type:"men",img:"https://source.unsplash.com/300x400/?streetwear"},
{name:"Premium Shirt",price:720,cat:"Shirt",type:"men",img:"https://source.unsplash.com/300x400/?formal-shirt"},

/* WOMEN */
{name:"Summer Dress",price:680,cat:"Dress",type:"women",img:"https://source.unsplash.com/300x400/?dress"},
{name:"Party Dress",price:760,cat:"Dress",type:"women",img:"https://source.unsplash.com/300x400/?party-dress"},
{name:"Floral Dress",price:640,cat:"Dress",type:"women",img:"https://source.unsplash.com/300x400/?floral-dress"},
{name:"Crop Top",price:300,cat:"Top",type:"women",img:"https://source.unsplash.com/300x400/?crop-top"},
{name:"Skirt",price:450,cat:"Skirt",type:"women",img:"https://source.unsplash.com/300x400/?skirt"},
{name:"Kurti",price:550,cat:"Ethnic",type:"women",img:"https://source.unsplash.com/300x400/?kurti"},
{name:"Saree",price:900,cat:"Ethnic",type:"women",img:"https://source.unsplash.com/300x400/?saree"},
{name:"Lehenga",price:1500,cat:"Ethnic",type:"women",img:"https://source.unsplash.com/300x400/?lehenga"},
{name:"Dupatta Set",price:600,cat:"Ethnic",type:"women",img:"https://source.unsplash.com/300x400/?dupatta"},
{name:"Anarkali",price:1100,cat:"Ethnic",type:"women",img:"https://source.unsplash.com/300x400/?anarkali"},

/* FOOTWEAR */
{name:"Sports Shoes",price:1200,cat:"Footwear",type:"footwear",img:"https://source.unsplash.com/300x400/?shoes"},
{name:"Sneakers",price:1400,cat:"Footwear",type:"footwear",img:"https://source.unsplash.com/300x400/?sneakers"},
{name:"Formal Shoes",price:1600,cat:"Footwear",type:"footwear",img:"https://source.unsplash.com/300x400/?formal-shoes"},
{name:"Sandals",price:700,cat:"Footwear",type:"footwear",img:"https://source.unsplash.com/300x400/?sandals"},
{name:"Heels",price:1300,cat:"Footwear",type:"footwear",img:"https://source.unsplash.com/300x400/?heels"},

/* ACCESSORIES */
{name:"Luxury Watch",price:5000,cat:"Watch",type:"accessories",img:"https://source.unsplash.com/300x400/?watch"},
{name:"Sunglasses",price:800,cat:"Accessory",type:"accessories",img:"https://source.unsplash.com/300x400/?sunglasses"},
{name:"Handbag",price:1500,cat:"Bag",type:"accessories",img:"https://source.unsplash.com/300x400/?handbag"},
{name:"Backpack",price:1200,cat:"Bag",type:"accessories",img:"https://source.unsplash.com/300x400/?backpack"},
{name:"Wallet",price:600,cat:"Accessory",type:"accessories",img:"https://source.unsplash.com/300x400/?wallet"},

/* KIDS */
{name:"Kids Shirt",price:400,cat:"Kids",type:"kids",img:"https://source.unsplash.com/300x400/?kids-shirt"},
{name:"Kids Dress",price:500,cat:"Kids",type:"kids",img:"https://source.unsplash.com/300x400/?kids-dress"},
{name:"Kids Hoodie",price:600,cat:"Kids",type:"kids",img:"https://source.unsplash.com/300x400/?kids-hoodie"},
{name:"Kids Shoes",price:700,cat:"Kids",type:"kids",img:"https://source.unsplash.com/300x400/?kids-shoes"},
{name:"Kids Jacket",price:800,cat:"Kids",type:"kids",img:"https://source.unsplash.com/300x400/?kids-jacket"},

/* ELECTRONICS (NEW) */
{name:"Wireless Earbuds",price:2200,cat:"Electronics",type:"electronics",img:"https://source.unsplash.com/300x400/?earbuds"},
{name:"Smart Watch",price:3500,cat:"Electronics",type:"electronics",img:"https://source.unsplash.com/300x400/?smartwatch"},
{name:"Bluetooth Speaker",price:1800,cat:"Electronics",type:"electronics",img:"https://source.unsplash.com/300x400/?speaker"},
{name:"Gaming Mouse",price:1200,cat:"Electronics",type:"electronics",img:"https://source.unsplash.com/300x400/?gaming-mouse"},
{name:"Mechanical Keyboard",price:2500,cat:"Electronics",type:"electronics",img:"https://source.unsplash.com/300x400/?keyboard"},

/* 🔥 DUPLICATED VARIANTS TO MAKE 100 */
...Array.from({length:50}, (_,i)=>({
name:`Premium Product ${i+1}`,
price:300 + (i*20),
cat:"Premium",
type:"men",
img:`https://source.unsplash.com/300x400/?fashion&sig=${i}`
}))

];

/* FILTER */
if(selectedCategory){
products = products.filter(p => p.type === selectedCategory);
}

/* SAVE FOR SEARCH PAGE */
localStorage.setItem("allProducts", JSON.stringify(products));

/* RENDER */
let grid=document.getElementById("productGrid");

products.forEach(p=>{
grid.innerHTML+=`
<div class="col-lg-3 col-md-4 col-sm-6">
<div class="product-card">

<img src="${p.img}" class="img-fluid">

<span class="category">${p.cat}</span>

<h6 class="mt-2">${p.name}</h6>

<div class="price">₹${p.price}</div>

<div class="button-group">

<button class="cart-btn"
onclick="addToCart('${p.name}',${p.price},'${p.img}')">
Add to Cart
</button>

<button class="btn btn-outline-light btn-sm"
onclick="openProduct('${p.name}',${p.price},'${p.img}')">
Details
</button>

</div>

</div>
</div>
`;
});

/* CART */
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function addToCart(name,price,img){
let existing = cart.find(i=>i.name===name);
if(existing) existing.qty++;
else cart.push({name,price,image:img,qty:1});
localStorage.setItem("cart",JSON.stringify(cart));
alert("Added to cart");
}

/* OPEN DETAILS */
function openProduct(name,price,img){
localStorage.setItem("selectedProduct",
JSON.stringify({name,price,image:img}));
window.location.href="product_details.html";
}

</script>
</body>
</html>
