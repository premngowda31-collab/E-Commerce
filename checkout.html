<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
margin:0;
font-family:Arial;
color:white;
overflow-x:hidden;
}

/* BACKGROUND */

#bg{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background-size:cover;
background-position:center;
z-index:-2;
transition:1.5s;
}

.bg-overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
z-index:-1;
}

/* CARD */

.checkout-card{
background:rgba(255,255,255,0.15);
backdrop-filter:blur(12px);
border-radius:15px;
padding:35px;
border:1px solid rgba(255,255,255,0.3);
box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

/* STEPS */

.step{
display:none;
animation:slide .5s ease;
}

.step.active{
display:block;
}

@keyframes slide{
from{opacity:0;transform:translateX(30px);}
to{opacity:1;transform:translateX(0);}
}

/* PAYMENT */

.payment-option{
border:1px solid rgba(255,255,255,0.4);
padding:12px;
border-radius:8px;
margin-bottom:10px;
cursor:pointer;
}

.upi-box{
display:none;
border:1px solid rgba(255,255,255,0.4);
padding:15px;
border-radius:8px;
text-align:center;
}

.timer{
font-size:18px;
color:#ffd700;
font-weight:bold;
}

/* OTP */

.otp-container{
display:flex;
justify-content:center;
gap:10px;
margin-top:20px;
}

.otp-input{
width:45px;
height:50px;
text-align:center;
font-size:22px;
border-radius:8px;
border:none;
}

/* SUCCESS */

.success-box{
text-align:center;
padding:60px;
animation:fadeIn 1.2s ease;
}

@keyframes fadeIn{
from{opacity:0;transform:scale(0.9);}
to{opacity:1;transform:scale(1);}
}

.checkmark{
width:100px;
height:100px;
background:#28a745;
border-radius:50%;
margin:auto;
position:relative;
animation:pop 0.6s ease;
}

@keyframes pop{
0%{transform:scale(0);}
100%{transform:scale(1);}
}

.checkmark::after{
content:'✔';
font-size:50px;
color:white;
position:absolute;
top:22px;
left:32px;
}

canvas{
position:fixed;
top:0;
left:0;
pointer-events:none;
}

</style>

</head>

<body>

<canvas id="confetti"></canvas>

<div id="bg"></div>
<div class="bg-overlay"></div>

<div class="container py-5">
<div class="row justify-content-center">
<div class="col-lg-8">

<div class="checkout-card">

<!-- STEP 1 -->

<div class="step active" id="step1">

<h3 class="mb-4">Billing Details</h3>

<input class="form-control mb-3" id="firstName" placeholder="First Name">
<input class="form-control mb-3" id="lastName" placeholder="Last Name">
<input class="form-control mb-3" id="email" placeholder="Email">
<input class="form-control mb-3" id="phone" placeholder="Phone Number">
<input class="form-control mb-3" id="address" placeholder="Billing Address">

<button class="btn btn-light" onclick="validateBilling()">Continue</button>

</div>

<!-- STEP 2 -->

<div class="step" id="step2">

<h4>Payment Method</h4>

<div class="payment-option">
<input type="radio" name="pay"> Cash on Delivery
</div>

<div class="payment-option">
<input type="radio" name="pay" onclick="showUPI()"> QR Payment
</div>

<div id="upiBox" class="upi-box">

<h6>Scan Demo QR</h6>

<img id="upiQR" width="200">

<p class="mt-2">Demo UPI: test@upi</p>

<p class="timer">Time left: <span id="timer">120</span>s</p>

<button class="btn btn-success mt-3" onclick="confirmPayment()">I Have Paid</button>

</div>

<button class="btn btn-secondary" onclick="prevStep('step1')">Back</button> <button class="btn btn-light" onclick="nextStep('step3')">Continue</button>

</div>

<!-- STEP 3 -->

<div class="step" id="step3">

<h4>Review Order</h4>

<hr>

<strong>Total: ₹<span id="totalPrice">0</span></strong>

<br><br>

<input type="text" id="couponInput" class="form-control mb-2" placeholder="Enter coupon code">

<button class="btn btn-success mb-2" onclick="applyCoupon()">Apply Coupon</button>

<p id="couponMessage"></p>

<button class="btn btn-secondary" onclick="prevStep('step2')">Back</button> <button class="btn btn-success" onclick="placeOrder()">Place Order</button>

</div>

<!-- OTP STEP -->

<div class="step text-center" id="otpStep">

<h4>OTP Verification</h4>

<p id="otpMessage"></p>

<div class="otp-container">
<input class="otp-input" maxlength="1">
<input class="otp-input" maxlength="1">
<input class="otp-input" maxlength="1">
<input class="otp-input" maxlength="1">
<input class="otp-input" maxlength="1">
<input class="otp-input" maxlength="1">
</div>

<p class="mt-3">Resend OTP in <span id="resendTimer">30</span>s</p>

<button class="btn btn-success mt-3" onclick="verifyOTP()">Verify OTP</button>

</div>

<!-- SUCCESS -->

<div class="step success-box" id="successStep">

<div class="checkmark"></div>

<h2 class="mt-4">Order Confirmed!</h2>

<p>Thank you for shopping with <b>Mysuru Fashion</b></p>

<p>Total Paid: ₹<span id="finalAmount"></span></p>

<p>Order ID: <span id="orderID"></span></p>

</div>

</div>
</div>
</div>
</div>

<script>

/* CART TOTAL */

let totalAmount = parseFloat(localStorage.getItem("cartTotal")) || 0;

document.getElementById("totalPrice").innerText = totalAmount.toFixed(2);

/* QR */

function updateQR(){

let upiLink="upi://pay?pa=test@upi&pn=Demo&am="+totalAmount+"&cu=INR";

let qrURL="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data="+encodeURIComponent(upiLink);

document.getElementById("upiQR").src=qrURL;

}

updateQR();

/* BACKGROUND */

const images=[
"https://images.unsplash.com/photo-1556745757-8d76bdb6984b",
"https://images.unsplash.com/photo-1607082349566-187342175e2f",
"https://images.unsplash.com/photo-1483985988355-763728e1935b"
];

let i=0;

function changeBG(){
document.getElementById("bg").style.backgroundImage="url('"+images[i]+"')";
i=(i+1)%images.length;
}

changeBG();
setInterval(changeBG,5000);

/* STEPS */

function nextStep(id){
document.querySelectorAll(".step").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

function prevStep(id){
nextStep(id);
}

/* BILLING */

function validateBilling(){

let f=document.getElementById("firstName").value.trim();
let l=document.getElementById("lastName").value.trim();
let e=document.getElementById("email").value.trim();
let p=document.getElementById("phone").value.trim();
let a=document.getElementById("address").value.trim();

if(!f||!l||!e||!p||!a){
alert("Please fill all required fields first");
return;
}

nextStep("step2");

}

/* COUPONS */

function applyCoupon(){

let c=document.getElementById("couponInput").value.toUpperCase();
let discount=0;

switch(c){

case "SAVE10": discount=totalAmount*0.1; break;
case "SAVE20": discount=totalAmount*0.2; break;
case "SAVE30": discount=totalAmount*0.3; break;
case "BIGSALE": discount=totalAmount*0.4; break;
case "FESTIVE25": discount=totalAmount*0.25; break;
case "FLAT100": discount=100; break;
case "FLAT200": discount=200; break;
case "WELCOME50": discount=50; break;
case "MEGA500": discount=500; break;
case "FREESHIP": discount=50; break;

default:
document.getElementById("couponMessage").innerText="Invalid coupon";
return;

}

totalAmount=Math.max(0,totalAmount-discount);

document.getElementById("totalPrice").innerText=totalAmount.toFixed(2);

document.getElementById("couponMessage").innerText="Coupon applied successfully";

updateQR();

}

/* OTP */

let generatedOTP;

function placeOrder(){

generatedOTP=Math.floor(100000+Math.random()*900000);

let phone=document.getElementById("phone").value;
let email=document.getElementById("email").value;

document.getElementById("otpMessage").innerText=
"Your order has been placed. Please verify the OTP sent to "+phone+" / "+email+
". (Demo OTP: "+generatedOTP+")";

startResendTimer();

nextStep("otpStep");

}

/* VERIFY OTP */

function verifyOTP(){

let inputs=document.querySelectorAll(".otp-input");

let entered="";

inputs.forEach(i=>entered+=i.value);

if(entered==generatedOTP){

let id="ORD"+Math.floor(Math.random()*100000);

document.getElementById("orderID").innerText=id;

document.getElementById("finalAmount").innerText=totalAmount.toFixed(2);

nextStep("successStep");

startConfetti();

let speech=new SpeechSynthesisUtterance(
"Your order is confirmed. Thank you for shopping with Mysuru Fashion!"
);

speech.rate=0.9;

window.speechSynthesis.speak(speech);

localStorage.removeItem("cartTotal");

}else{

alert("Invalid OTP");

}

}

/* RESEND TIMER */

function startResendTimer(){

let t=30;

let interval=setInterval(function(){

t--;

document.getElementById("resendTimer").innerText=t;

if(t<=0){
clearInterval(interval);
document.getElementById("resendTimer").innerText="0";
}

},1000);

}

/* CONFETTI */

const canvas=document.getElementById("confetti");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let pieces=[];

function startConfetti(){

for(let i=0;i<200;i++){

pieces.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
size:5+Math.random()*5,
speed:2+Math.random()*3
});

}

animateConfetti();

}

function animateConfetti(){

ctx.clearRect(0,0,canvas.width,canvas.height);

pieces.forEach(p=>{

ctx.fillStyle="hsl("+Math.random()*360+",100%,50%)";

ctx.fillRect(p.x,p.y,p.size,p.size);

p.y+=p.speed;

if(p.y>canvas.height) p.y=0;

});

requestAnimationFrame(animateConfetti);

}

/* OTP AUTO MOVE */

document.addEventListener("DOMContentLoaded",()=>{

let inputs=document.querySelectorAll(".otp-input");

inputs.forEach((input,index)=>{

input.addEventListener("input",()=>{

if(input.value.length===1 && index<5){

inputs[index+1].focus();

}

});

});

});

</script>

</body>
</html>
