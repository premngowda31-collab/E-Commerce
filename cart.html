<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shopping Cart</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

<style>

/* Animated Background */

body{
font-family:'Segoe UI',sans-serif;
color:white;
background:linear-gradient(-45deg,#1d4350,#a43931,#0f2027,#2c5364);
background-size:400% 400%;
animation:bgMove 12s ease infinite;
}

@keyframes bgMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

/* Glass Card */

.glass{
background:rgba(255,255,255,0.12);
backdrop-filter:blur(12px);
border-radius:14px;
padding:25px;
box-shadow:0 8px 30px rgba(0,0,0,0.4);
}

/* Cart Item */

.cart-item{
padding:15px;
border-radius:10px;
transition:0.3s;
}

.cart-item:hover{
background:rgba(255,255,255,0.15);
transform:translateY(-3px);
}

/* Product Image */

.product-img{
transition:0.4s;
}

.product-img:hover{
transform:scale(1.1);
}

/* Quantity */

.qty{
width:55px;
text-align:center;
border-radius:6px;
border:none;
}

/* Remove */

.remove{
cursor:pointer;
color:#ff6b6b;
}

.remove:hover{
color:red;
}

/* Checkout Button */

.checkout-btn{
background:linear-gradient(45deg,#ff416c,#ff4b2b);
border:none;
color:white;
font-weight:bold;
}

.checkout-btn:hover{
transform:scale(1.05);
box-shadow:0 8px 20px rgba(0,0,0,0.4);
}

</style>

</head>

<body>

<div class="d-flex justify-content-between align-items-center px-4 pt-3">

<a href="about_us.html" class="btn btn-light">
<i class="fas fa-store mr-2"></i> About Us
</a>

<div style="position:relative">

<i class="fas fa-shopping-cart fa-2x"></i>

<span id="cartCounter"
style="position:absolute;top:-8px;right:-10px;background:red;color:white;border-radius:50%;padding:2px 7px;font-size:12px;">
0 </span>

</div>

</div>

<section class="py-5">

<div class="container">

<h1 class="text-center mb-5">Your Shopping Cart</h1>

<div class="glass">

<div id="cartItems"></div>

<div id="emptyCart" class="text-center">
<h4>Your cart is empty 🛒</h4>
<a href="product.html" class="btn btn-light mt-3">Start Shopping</a>
</div>

<hr>

<div class="text-right mt-3">
<h4>Total: ₹<span id="cartTotal">0</span></h4>
</div>

<hr class="mt-4">

<div class="text-center mt-4">

<a href="product.html" class="btn btn-light btn-lg px-5 mr-3">
<i class="fas fa-shopping-bag mr-2"></i> Continue Shopping
</a>

<a href="checkout.html" class="btn checkout-btn btn-lg px-5">
<i class="fas fa-credit-card mr-2"></i> Proceed to Checkout
</a>

</div>

</div>

</div>

</section>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

function loadCart(){

let container = document.getElementById("cartItems");
container.innerHTML = "";

let total = 0;
let totalItems = 0;

if(cart.length === 0){

document.getElementById("emptyCart").style.display="block";
document.getElementById("cartTotal").innerText = 0;
document.getElementById("cartCounter").innerText = 0;

localStorage.setItem("cartTotal",0);   // SAVE EMPTY TOTAL

return;

}

document.getElementById("emptyCart").style.display="none";

cart.forEach((item,index)=>{

let itemTotal = item.price * item.qty;

total += itemTotal;
totalItems += item.qty;

container.innerHTML += `

<div class="row align-items-center cart-item">

<div class="col-md-2">
<img src="${item.image}" class="img-fluid product-img">
</div>

<div class="col-md-4">
<h6>${item.name}</h6>
</div>

<div class="col-md-3">

<button class="btn btn-sm btn-light" onclick="changeQty(${index},-1)">
<i class="fas fa-minus"></i>
</button>

<input type="number" value="${item.qty}" class="qty" readonly>

<button class="btn btn-sm btn-light" onclick="changeQty(${index},1)">
<i class="fas fa-plus"></i>
</button>

</div>

<div class="col-md-2">
₹${itemTotal}
</div>

<div class="col-md-1">
<i class="fas fa-trash remove" onclick="removeItem(${index})"></i>
</div>

</div>

<hr>

`;

});

document.getElementById("cartTotal").innerText = total;
document.getElementById("cartCounter").innerText = totalItems;

/* SAVE TOTAL FOR CHECKOUT */

localStorage.setItem("cartTotal", total);

}

function changeQty(index,val){

cart[index].qty += val;

if(cart[index].qty < 1){
cart[index].qty = 1;
}

localStorage.setItem("cart",JSON.stringify(cart));
loadCart();

}

function removeItem(index){

cart.splice(index,1);

localStorage.setItem("cart",JSON.stringify(cart));
loadCart();

}

loadCart();

</script>

</body>
</html>
